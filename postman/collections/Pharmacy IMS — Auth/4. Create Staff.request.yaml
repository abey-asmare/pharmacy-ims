$kind: http-request
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "full_name": "Jane Staff",
      "email": "jane@pharmacy.example",
      "password": "StaffPass1",
      "role": "pharmacy_staff"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('user_id', pm.response.json().id);
      }
order: 4000
